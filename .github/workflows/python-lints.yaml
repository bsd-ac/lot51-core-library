name: Python Lints

on:
  push:
    branches: [main]
  pull_request:
    branches: 
      - "*"

env:
  SIMS4_VERSION: "1.116.240.1020"
  SIMS4_SCRIPTS_URL: "https://files.bsd.ac/gamez/sims4-decompiled-1.116.240.1020.zip"
  SHA256_SUM: "fb1243ed87819db8509336943850285db766a6b8441387018db6cac7d4fbc4cd"

jobs:
  python-lints:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up anaconda
        uses: s-weigand/setup-conda@v1
        with:
          python-version: '3.7.1'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Sims 4 scripts
        run: |
          curl -L ${{ env.SIMS4_SCRIPTS_URL }} -o sims4_scripts.zip

      # - name: Check that sims4 scripts hash is correct
      #   run: |
      #     echo "${{ env.SHA256_SUM }}  sims4_scripts.zip" | sha256sum -c

      - name: Unzip Sims 4 scripts
        run: |
          unzip -o sims4_scripts.zip -d ../sims4_scripts

      - name: Add sims4 scripts to conda search paths
        run: |
          sim4path=$(readlink -f ../sims4_scripts)
          conda develop ${sims4path}/base
          conda develop ${sims4path}/core
          conda develop ${sims4path}/generated
          conda develop ${sims4path}/simulation

      - name: Run ruff formatter
        run: |
          ruff format --check .

      - name: Run ruff linter
        if: ${{ success() || failure() }}
        run: |
          ruff check --preview .

      - name: Check that mypy is happy
        if: ${{ success() || failure() }}
        run: |
          mypy .
